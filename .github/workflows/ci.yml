name: CI

on:
  push:
    branches: [main, "2R"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    # Unit tests run without a database. Settings still validate at import, so
    # give them a complete configuration that points at nothing.
    env:
      PYTHON_DOTENV_DISABLED: "1"
      CAPTURE_SOURCE: simulated
      DATABASE_URL: postgresql://ci:unused@127.0.0.1:1/blackrabbit_unit # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run pytest -m "not integration" --cov --cov-fail-under=60

  frontend:
    name: Frontend (web/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - name: Detect the separately committed frontend
        id: frontend
        working-directory: .
        run: echo "present=$(test -f web/pnpm-lock.yaml && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.frontend.outputs.present == 'true'
        with:
          node-version: "20"
      - run: corepack enable
        if: steps.frontend.outputs.present == 'true'
      - run: corepack pnpm@9.15.9 install --frozen-lockfile
        if: steps.frontend.outputs.present == 'true'
      - run: corepack pnpm@9.15.9 lint
        if: steps.frontend.outputs.present == 'true'
      - run: corepack pnpm@9.15.9 test
        if: steps.frontend.outputs.present == 'true'
      - run: corepack pnpm@9.15.9 build
        if: steps.frontend.outputs.present == 'true'
