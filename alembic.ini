# Consensai 1a — Alembic Configuration
# The actual database URL is read from .env by env.py,
# NOT from the sqlalchemy.url line below.

[alembic]
# Path to migration scripts, relative to this file
script_location = db/alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Truncate long revision identifiers in filenames
truncate_slug_length = 40

# Output encoding
output_encoding = utf-8

# This is a placeholder — env.py overrides it with DATABASE_URL from .env
sqlalchemy.url = postgresql://placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
